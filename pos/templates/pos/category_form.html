{% extends 'base.html' %}
{% block title %}Edit category | Retail POS{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6"><div class="card"><div class="card-body"><h1 class="h3">Edit category</h1><form method="post">{% csrf_token %}<div class="mb-3">{{ form.name.label_tag }}{{ form.name }}{% for error in form.name.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div><button class="btn btn-primary">Save</button> <a class="btn btn-outline-secondary" href="{% url 'category_list' %}">Cancel</a></form></div></div></div></div>
{% endblock %}
